[project]
name = "talent-kb"
version = "1.0.0"
description = "Talent Knowledge Base MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "fastmcp>=3.0.0b1",
    "mcp>=1.0.0",
    "boto3>=1.35.0",
    "kb-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.uv.sources]
"kb-shared" = { path = "../../shared", editable = true }
